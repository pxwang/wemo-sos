name: WemoControlIOS
options:
  bundleIdPrefix: com.local
targets:
  WemoControlIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: WemoControl
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "WemoControl discovers and controls Wemo switches on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.wemocontrolios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOUR_TEAM_ID # replace with your Apple Developer Team ID (Xcode > Settings > Accounts, or `security find-certificate -c "Apple Development" -p | openssl x509 -noout -subject`, the OU= field)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
